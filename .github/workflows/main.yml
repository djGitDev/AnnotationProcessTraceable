name: Maven Build and Test

on:
  push:
    branches:
      - main  # ou la branche sur laquelle tu veux que le workflow soit exécuté
  pull_request:
    branches:
      - main  # ou la branche pour laquelle tu veux valider les PR

jobs:
  build:
    runs-on: ubuntu-latest  # Tu peux changer cela si tu préfères un autre système d'exploitation

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up JDK 17
      uses: actions/setup-java@v2
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build with Maven
      run: mvn clean install

    - name: Run tests with Maven
      run: mvn test

   
